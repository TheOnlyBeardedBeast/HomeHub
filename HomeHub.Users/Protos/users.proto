syntax = "proto3";

package HomeHub.Users;

import "google/protobuf/empty.proto";

option csharp_namespace = "HomeHub.Users";

enum UserType {
  // A person signed in on their own device.
  USER_TYPE_END_USER = 0;
  // A shared screen the whole household uses.
  USER_TYPE_DISPLAY = 1;
}

message User {
  string id = 1;
  string full_name = 2;
  UserType type = 3;
}

message CreateUserRequest {
  string full_name = 1;
  UserType type = 2;
}

message CreateUserResponse {
  User user = 1;
  // Returned once on creation; only its SHA-256 hash is stored.
  string api_key = 2;
}

message ListUsersRequest {
}

message ListUsersResponse {
  repeated User users = 1;
}

message GetCurrentUserRequest {
}

message GetCurrentUserResponse {
  // Absent when the caller authenticated with the admin API key.
  User user = 1;
  bool is_admin = 2;
}

message DeleteUserRequest {
  string id = 1;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
}
