syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package HomeHub.Notes;

option csharp_namespace = "HomeHub.Notes";

message Note {
  string id = 1;
  string title = 2;
  string content = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp updated_at = 6;
}

message CreateNoteRequest {
  Note note = 1;
}

message CreateNoteResponse {
  string id = 1;
}

message GetNoteRequest {
  string id = 1;
}

message GetNoteResponse {
  Note note = 1;
}

message UpdateNoteRequest {
  Note note = 1;
}

message DeleteNoteRequest {
  string id = 1;
}

message ListNotesRequest {
}

message ListNotesResponse {
  repeated Note notes = 1;
}

message SearchNotesRequest {
  string query = 1;
}

message SearchNotesResponse {
  repeated Note notes = 1;
}

service NoteService {
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (google.protobuf.Empty);
  rpc DeleteNote(DeleteNoteRequest) returns (google.protobuf.Empty);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc SearchNotes(SearchNotesRequest) returns (SearchNotesResponse);
}
